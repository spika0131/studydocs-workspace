services:
  - type: web
    name: studydocs-workspace
    runtime: python
    plan: free
    healthCheckPath: /api/health
    buildCommand: pip install --upgrade -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
